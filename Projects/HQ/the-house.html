/* The House, redrawn as a climb.
   The earlier version scrolled top-down like a document. This one refuses that:
   the page never scrolls, y is ALTITUDE (cellar at the bottom), x is TIME, and
   the reading position is driven by the wheel rather than by the scrollbar. You
   start in the cellar because that is where the work starts, and you climb.

   Two axes, honestly drawn. The horizontal one is broken: six months of quiet,
   then thirteen days that built the whole estate. A broken axis is the honest
   shape here, and it is marked as broken rather than hidden by stretching. */

:root{
  --cellar:var(--cl-08-time);
  --stairs:var(--cl-03-flow);
  --floor1:var(--cl-12-life);
  --edge:var(--space-lg);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surface-page)}
body{
  color:var(--text-primary);font-family:var(--font-sans);
  font-size:var(--fs-body);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}

/* ── The stage: fixed, full-bleed, never scrolled by the browser ───────────── */
.stage{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── The plot: the whole ascent, always visible, the reading position marked ── */
.plot-wrap{position:relative;flex:1 1 auto;min-height:0;padding:var(--space-md) var(--edge) 0;display:flex}
.plot{width:100%;height:100%;display:block;overflow:visible}

/* Bands: one per floor, drawn as an outline, never a fill behind text. */
.band{fill:none;stroke:var(--g24);stroke-width:1}
.band-lit{stroke-width:3}
.band-name{font-family:var(--font-mono);font-size:13px;fill:var(--text-secondary)}
.band-sub{font-family:var(--font-mono);font-size:11px;fill:var(--text-dim)}

/* Depth. The house was four flat rectangles, which is a diagram of a building
   rather than a building. The four bands sit in one perspective stage and each
   is pushed back in z by its rank, so the cellar is nearest and the register
   furthest. transform-box is set because an SVG rect otherwise ignores the
   translate in some engines.

   The motion is Mark's own grammar: the 360ms ease-arrive from
   tokens/motion.css, with the system's reduced-motion collapse applying here. */
.plot-stage{transform-style:preserve-3d;perspective:1500px;perspective-origin:50% 40%}
.band-depth{transform-box:fill-box;transform-origin:50% 100%;
  transition:transform var(--dur-lg) var(--ease-arrive),opacity var(--dur-lg) var(--ease-arrive)}
.band-depth[data-depth="1"]{transform:translateZ(0)}
.band-depth[data-depth="2"]{transform:translateZ(30px)}
.band-depth[data-depth="3"]{transform:translateZ(60px)}
.band-depth[data-depth="4"]{transform:translateZ(90px)}
/* The floor you are on comes forward; the ones already climbed sit back. One
   attribute, written from paint(), so the depth follows the climb. */
.band-depth[data-live="1"]{transform:translateZ(112px)}
.band-depth[data-spent="1"]{opacity:0.6}
@media (prefers-reduced-motion:reduce){
  .band-depth{transition:transform 1ms!important,opacity 1ms!important}
}
body[data-reduce-motion] .band-depth{transition:transform 1ms!important,opacity 1ms!important}
.ground{stroke:var(--g48);stroke-width:1;stroke-dasharray:2 5}
.ground-label{font-family:var(--font-mono);font-size:11px;fill:var(--g48)}
.axis-line{stroke:var(--g24);stroke-width:1}
.tick{font-family:var(--font-mono);font-size:11px;fill:var(--text-dim)}
.tick-rule{stroke:var(--g24);stroke-width:1}
/* The break. Drawn as the double-slash it is, so the gap is never mistaken for data. */
.break-mark{stroke:var(--g66);stroke-width:2;fill:none}
.break-label{font-family:var(--font-mono);font-size:11px;fill:var(--text-secondary)}

/* The climb itself: the dashed line is the whole history, the solid one is how
   far you have climbed. Same path, two strokes, one geometry. */
.climb-ghost{stroke:var(--g48);stroke-width:2;fill:none;stroke-dasharray:1 6;stroke-linecap:round}
.climb-done{stroke:var(--white);stroke-width:3;fill:none;stroke-linecap:round}
/* The head must read as "you are here", distinct from the line it rides on. */
.climb-head{fill:var(--black);stroke:var(--white);stroke-width:3}

.station{fill:none;stroke-width:3;cursor:pointer}
.station[data-past="1"]{fill:var(--g06)}
.station-now{fill:none;stroke:var(--white);stroke-width:3}
.station-label{font-family:var(--font-mono);font-size:11px;fill:var(--text-dim);pointer-events:none;
  paint-order:stroke fill;stroke:var(--black);stroke-width:3px;stroke-linejoin:round}
.station-label[data-past="1"]{fill:var(--text-secondary)}
/* Two stations can share a day and a floor, so their labels take different
   heights inside the band rather than fighting for the same line. */
.station-label[data-lift="1"]{fill:var(--text-secondary)}

/* ── The reading card: what is at this point on the climb ──────────────────── */
.readout{
  flex:0 0 auto;border-top:var(--stroke) solid var(--surface-border);
  padding:var(--space-md) var(--edge) var(--space-lg);
  display:grid;gap:var(--space-md) var(--space-xl);
  grid-template-columns:5fr 7fr;align-items:start;
}
/* The plot is wide and short, so on a phone it would letterbox into a stamp with
   dead space above it. The frame keeps its aspect but the plot grows to fill the
   height it is given, which means a taller drawing on a narrow frame rather than
   a small one floating in white. */
@media (max-width:720px){
  .stage{gap:0}
  .plot-wrap{padding:var(--space-sm) var(--space-md) 0}
  .plot{width:100%;height:auto;max-height:100%}
  .readout{padding:var(--space-md) var(--page-pad,var(--space-md)) var(--space-lg)}
}
@media (min-width:1081px){.readout{padding-block:var(--space-lg)}}
.readout h1{margin:0;font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--fw-h1);max-width:24ch}
.readout h2{margin:0 0 var(--space-xs);font-size:var(--fs-caption);line-height:var(--lh-caption);
  font-weight:var(--fw-caption);color:var(--text-secondary);text-transform:uppercase}
.readout p{margin:0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary);max-width:56ch;text-wrap:pretty}
.readout p strong{color:var(--text-primary);font-weight:var(--fw-h2)}
.readout ul{margin:var(--space-sm) 0 0;padding-inline-start:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-xs)}
.readout li{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary)}
.readout li::marker{color:var(--g48)}
.readout .q{margin-top:var(--space-md);font-family:var(--font-mono);font-size:var(--fs-caption);
  line-height:var(--lh-caption);color:var(--text-dim)}
.chip{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:28px;
  padding:0 var(--space-md);border:var(--stroke) solid var(--t,var(--g48));border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:var(--fs-caption);line-height:var(--lh-caption)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--t,var(--g66))}

/* ── Controls ─────────────────────────────────────────────────────────────── */
.controls{
  position:fixed;inset-block-end:var(--space-lg);inset-inline-end:var(--edge);
  display:flex;gap:var(--space-sm);z-index:5;
}
.btn{
  display:inline-flex;align-items:center;gap:var(--space-sm);min-height:44px;padding:0 var(--space-lg);
  border:var(--stroke) solid var(--g48);border-radius:var(--radius-sm);
  background:var(--surface-page);color:var(--text-primary);cursor:pointer;
  font-family:var(--font-mono);font-size:var(--fs-caption);line-height:var(--lh-caption);
  transition:border-color var(--dur-sm) var(--ease-place),background-color var(--dur-sm) var(--ease-place),transform var(--dur-sm) var(--ease-place);
}
.btn:hover{border-color:var(--white);background:var(--g12)}
.btn:active{transform:scale(0.97)}
.btn:focus-visible{outline:2px solid var(--g88);outline-offset:3px}
@media (max-width:1080px){.readout{grid-template-columns:1fr}}
@media (max-width:720px){.controls{inset-block-end:var(--space-md)}}

/* ── The scrollbar that is not a scrollbar ────────────────────────────────── */
.climb-meter{
  position:fixed;inset-inline-start:var(--edge);inset-block:0;width:26px;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-md);
}
.meter-track{position:relative;width:3px;height:min(56vh,460px);background:var(--g24);border-radius:2px}
.meter-fill{position:absolute;inset-inline:0;bottom:0;background:var(--white);border-radius:2px;
  box-shadow:0 0 0 1px var(--white);
  transition:height var(--dur-md) var(--ease-place)}
.meter-stop{position:absolute;inset-inline-start:50%;translate:-50% 0;background:none;border:0;
  padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.meter-stop::before{content:"";width:9px;height:9px;border-radius:50%;
  border:2px solid var(--g24);background:var(--g24);transition:all var(--dur-sm) var(--ease-place)}
.meter-stop[data-on="1"]::before{border-color:var(--t,var(--white));background:transparent;width:13px;height:13px}
.meter-stop:hover::before{border-color:var(--g66)}
.meter-stop:focus-visible{outline:2px solid var(--g88);outline-offset:2px;border-radius:var(--radius-sm)}
.meter-label{position:absolute;inset-inline-start:26px;white-space:nowrap;font-family:var(--font-mono);
  font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-secondary);pointer-events:none}
@media (max-width:1080px){.climb-meter{display:none}}

/* Lane tracks: one per repo, drawn under the ground line. Each mark is a day
   with landings and its height is that day's count, so four lanes working at
   once read as four rows of density rather than one flat line. */
.lane-track{stroke:var(--g24);stroke-width:1}
.lane-fill{fill:var(--g48)}
.lane-name{font-family:var(--font-mono);font-size:11px;fill:var(--text-dim)}
.lane-count{font-family:var(--font-mono);font-size:11px;fill:var(--text-secondary)}
@media (max-width:1080px){.lane-name{display:none}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

'use strict';
/* The climb. The browser's scroll is never used: html and body are overflow:hidden,
   so the wheel, the arrow keys, the buttons and the floor stops all drive one number,
   `at`, which is an index into the station list. Everything visible is derived from
   it. That is what makes bottom-up possible at all, because a document that scrolls
   top-down cannot be made to start at its end without the reader's scrollbar lying
   about where they are.

   The one honest compromise, stated rather than hidden: a wheel is a wheel. The
   listener takes its sign from the reader's intent (wheel down means "further along
   the climb") and the page answers by moving the reading head UP. A reader who wants
   the opposite can invert it in one press, and the toggle is on screen rather than
   buried, because a control nobody can find is not a control. */
(function () {
  var FLOORS = {
    register: { name: 'The Register', sub: 'what outlives the session', y: 106, tone: 'var(--g66)' },
    floor:    { name: 'The Main Floor', sub: 'the door, the hall, the windows', y: 236, tone: 'var(--cl-12-life)' },
    stairs:   { name: 'The Stairs', sub: 'category, lane, agent, riser, landing', y: 366, tone: 'var(--cl-03-flow)' },
    cellar:   { name: 'The Cellar', sub: 'the machine, running unwatched', y: 491, tone: 'var(--cl-08-time)' }
  };
  var BANDS = { register: [46, 166], floor: [176, 296], stairs: [306, 426], cellar: [436, 546] };

  /* The stations, in climb order. `d` is days since 1 April 2026; `dupe` nudges two
     stations that share a day and a floor apart, so neither is hidden behind the other. */
  var STATIONS = [
    { d: 15, floor: 'cellar', dupe: -14, when: 'April 2026',
      title: 'The cellar, where the work starts',
      lede: 'Everything the estate runs on was true from the first month. It just had no addresses, so none of it could be talked about without naming a model.',
      points: ['Claude Code on the desk, months before omO', 'One machine, one window, no floor above it'] },

    { d: 172, floor: 'cellar', when: '20 September',
      title: 'Three vaults, and one that answers',
      lede: 'The operations authority, the design language and the sensitive life hub. Cloud repos are the source of truth, and the local copy is never assumed to be live.',
      points: ['COMMAND, Re.SOURCE and PERSONAL', 'Mark never touches git and is never asked to'] },

    { d: 175, floor: 'cellar', when: '23 September',
      title: 'The reply law, written once',
      lede: 'The rule that a reply is a decision surface: a finding, a change or an ask, and nothing else. UK English, no em dashes, decisions as buttons rather than typed answers.',
      points: ['Voice became the primary input', 'Long prose is the wrong container'] },

    { d: 180, floor: 'floor', when: '28 September',
      title: 'The front door, and the first window',
      lede: 'The estate hub goes up, and the published site exists so a page can be opened from a phone. This is the first time the work becomes reachable rather than merely done.',
      points: ['Estate HQ groups Now, Studios, Pages, Vaults, Tools', 'A link that cannot be clicked is a link that does not exist'] },

    { d: 182, floor: 'floor', when: '30 September',
      title: 'omO takes the engine seat',
      lede: 'The harness becomes the thing that runs the work, and the console becomes the face, because the terminal was called clunky and the phone had to work.',
      points: ['Model names stop appearing in replies', 'The lane becomes the word Mark addresses'] },

    { d: 183, floor: 'stairs', dupe: -18, when: '1 October, morning',
      title: 'Three lanes get their names',
      lede: 'INTEL watches and reports, OPS executes, DESIGN makes. Each owns a kind of judgement, and each has one thing it never does, which is what makes it trustworthy.',
      points: ['Say the lane, never the model name', 'A lane re-pins itself from its own evidence'] },

    { d: 183, floor: 'stairs', dupe: 18, when: '1 October, later',
      title: 'The gears and the board',
      lede: 'Credit gear becomes four named states in one file with a date it must be revisited by, so a temporary gear can never quietly become permanent. lane-watch reads the pins and probes every seat.',
      points: ['open, conserve, bridge, pause', 'Every number on the board comes from the checker that owns it'] },

    { d: 184, floor: 'floor', when: '2 October',
      title: 'The terminal, called clunky three times',
      lede: 'The complaint lands as a specification: fewer terminals, each visibly labelled with its lane, converging on one place. The console is the destination, not another terminal.',
      points: ['The estate view is the answer to "what state is my estate in"', 'A slow route must never block the chat face'] },

    { d: 184, floor: 'register', when: '2 October, later',
      title: 'Memory becomes a repository',
      lede: 'Facts, preferences, decisions and corrections committed as they emerge. The lesson that generalises: derive a checker\'s rules from the written law, not from the data it inspects.',
      points: ['Markdown is the channel between agents, not a deliverable', 'A wrong before the change is a finding to report, never a test to edit green'] },

    { d: 185, floor: 'floor', dupe: -22, when: '3 October',
      title: 'The House is drawn',
      lede: 'Four floors, one front door, and every term given an address. The flat map had the right words and no shape, which is why it read as dead.',
      points: ['Cellar, Stairs, Main Floor, Register', 'Each floor answers one question: does this need you?'] },

    { d: 185, floor: 'register', dupe: -8, when: '3 October, later',
      title: 'The handoff block becomes a law',
      lede: 'Ask, wanted, For you, Now, Next. The shape of a reply that changes phase, so a result is never a wall of prose and never a bare claim.',
      points: ['A riser is the smallest thing that can be proven', 'Inconclusive is not approval'] },

    { d: 185, floor: 'stairs', dupe: 22, when: '3 October, same day',
      title: 'The stairs get their own words',
      lede: 'A riser is one step up the flight: a delegated child, a report, a delivered artefact. A landing is where only Mark can decide. Both coined here, and both checked against 948 files before adoption.',
      points: ['L1 / L2 / L3 cut: a second numbering scheme beside one that exists', 'The fallback for landing is decision point'] },

    { d: 185, floor: 'floor', dupe: 22, when: '3 October, same day',
      title: 'Every thread names its lane',
      lede: 'identity, lane, objective. A thread called "build the deck" while it is publishing the deck sends the next reader to the wrong phase, so the title is live rather than stamped.',
      points: ['The Sessions list becomes the lane board', 'A number decays where a name does not'] },

    { d: 185, floor: 'register', dupe: 22, when: '3 October, same day',
      title: 'The climb, plotted',
      lede: 'This graph. Altitude on the vertical, time on the horizontal, and the reading head starting at the bottom because that is where the work starts.',
      points: ['Six months of quiet, then thirteen days', 'The break in the axis is the finding, and it is marked as a break'] }
  ];

  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(n, a) { var e = document.createElementNS(SVGNS, n); for (var k in a) if (a[k] != null) e.setAttribute(k, a[k]); return e; }
  function $(id) { return document.getElementById(id); }

  /* The broken time axis. Segment A is 1 Apr to 30 Sep; segment B is 1 to 3 Oct.
     Drawn as two stretches with a marked break, because a single linear axis puts
     thirteen of fourteen stations in the last four pixels. */
  var A_END = 182, A0 = 150, A1 = 690, B0 = 740, B1 = 960, B_SPAN = 3;
  function X(d) { return d <= A_END ? A0 + (d / A_END) * (A1 - A0) : B0 + ((d - A_END - 1) / B_SPAN) * (B1 - B0); }
  STATIONS.forEach(function (s) { s.x = X(s.d) + (s.dupe || 0); });

  var bands = $('bands'), ground = $('ground'), axes = $('axes'), stationsG = $('stations');

  /* Depth rank: the cellar is nearest, the register furthest, so the house
     recedes upward the way a building does. */
  var DEPTH = { cellar: 1, stairs: 2, floor: 3, register: 4 };
  var bandKeys = ['register', 'floor', 'stairs', 'cellar'];
  var bandDepths = [];

  bandKeys.forEach(function (key) {
    var b = BANDS[key], f = FLOORS[key];
    var rect = el('rect', { class: 'band band-depth', x: 118, y: b[0], width: 872, height: b[1] - b[0], rx: 8, style: 'stroke:' + f.tone });
    rect.setAttribute('data-depth', DEPTH[key]);
    bands.appendChild(rect);
    bandDepths.push(rect);
    var nm = el('text', { class: 'band-name', x: 130, y: b[0] + 20 });
    nm.textContent = f.name; bands.appendChild(nm);
    var sb = el('text', { class: 'band-sub', x: 130, y: b[0] + 36 });
    sb.textContent = f.sub; bands.appendChild(sb);
  });

  ground.appendChild(el('line', { class: 'ground', x1: 118, y1: BANDS.cellar[0], x2: 990, y2: BANDS.cellar[0] }));
  var gl = el('text', { class: 'ground-label', x: 124, y: BANDS.cellar[0] - 6 });
  gl.textContent = 'ground'; ground.appendChild(gl);

  /* y axis ticks: the four floors, named once, at their own altitude. */
  axes.appendChild(el('line', { class: 'axis-line', x1: 118, y1: 40, x2: 118, y2: 560 }));
  axes.appendChild(el('line', { class: 'axis-line', x1: 118, y1: 560, x2: 990, y2: 560 }));
  [['Apr', 0], ['May', 30], ['Jun', 61], ['Jul', 91], ['Aug', 122], ['Sep', 153]].forEach(function (t) {
    var x = X(t[1]);
    axes.appendChild(el('line', { class: 'tick-rule', x1: x, y1: 560, x2: x, y2: 566 }));
    var tx = el('text', { class: 'tick', x: x, y: 580, 'text-anchor': 'middle' });
    tx.textContent = t[0]; axes.appendChild(tx);
  });
  [['1 Oct', 183], ['2 Oct', 184], ['3 Oct', 185]].forEach(function (t) {
    var x = X(t[1]);
    axes.appendChild(el('line', { class: 'tick-rule', x1: x, y1: 560, x2: x, y2: 566 }));
    var tx = el('text', { class: 'tick', x: x, y: 580, 'text-anchor': 'middle' });
    tx.textContent = t[0]; axes.appendChild(tx);
  });
  /* the break itself */
  axes.appendChild(el('line', { class: 'break-mark', x1: 700, y1: 552, x2: 712, y2: 568 }));
  axes.appendChild(el('line', { class: 'break-mark', x1: 716, y1: 552, x2: 728, y2: 568 }));
  var bl = el('text', { class: 'break-label', x: 714, y: 552, 'text-anchor': 'middle' });
  bl.textContent = '13 days, expanded'; axes.appendChild(bl);

  var ay = el('text', { class: 'break-label', x: 40, y: 300, transform: 'rotate(-90 40 300)', 'text-anchor': 'middle' });
  ay.textContent = 'altitude'; axes.appendChild(ay);
  var ax = el('text', { class: 'break-label', x: 940, y: 588, 'text-anchor': 'end' });
  ax.textContent = 'time'; axes.appendChild(ax);

  var d = STATIONS.map(function (s, i) { return (i ? 'L' : 'M') + s.x.toFixed(1) + ' ' + FLOORS[s.floor].y; }).join(' ');
  $('ghost').setAttribute('d', d);
  $('done').setAttribute('d', d);

  /* Labels: the day only, because the full date is in the readout and a long
     string here collides with its neighbours. Two stations sharing a day and a
     floor take different heights in the band so neither is hidden. */
  var seen = {};
  var dots = STATIONS.map(function (s, i) {
    var g = el('g', {});
    var c = el('circle', { class: 'station', cx: s.x.toFixed(1), cy: FLOORS[s.floor].y, r: 6, style: 'stroke:' + FLOORS[s.floor].tone });
    c.setAttribute('data-i', i);
    g.appendChild(c);

    var key = s.when.replace(/,.*$/, '') + '|' + s.floor;
    var nth = seen[key] || 0;
    seen[key] = nth + 1;
    var short = s.when.replace(/,.*$/, '').replace('September', 'Sep').replace('October', 'Oct');
    /* Centred on the dot, and above it: a centred label on a 70px column of
       dots is clear of its neighbours, whereas hanging one to the right runs it
       into the next dot and the plot edge. The band's own name is at the far
       left of the band, so the first dot's label never reaches it. */
    var lab = el('text', {
      class: 'station-label', x: s.x.toFixed(1),
      y: (FLOORS[s.floor].y - 16 - nth * 13).toFixed(1),
      'text-anchor': 'middle'
    });
    if (nth) lab.setAttribute('data-lift', '1');
    lab.textContent = short;
    g.appendChild(lab);
    stationsG.appendChild(g);
    return c;
  });

  /* Lane tracks, drawn from the data block the generator inlined in the head.
     Read once, here, and never fetched: a published static host and a file://
     capture both have to work, and one of them refuses a sibling fetch. */
  var LANES = (function () {
    var node = document.getElementById('house-lanes');
    if (!node) return null;
    try { return JSON.parse(node.textContent); } catch (e) { return null; }
  })();

  /* The axis sits above the lane tracks: the house bands end at the ground
     line, the axis labels run at 566, and the tracks start at 600 so nothing is
     drawn through anything else. Tracks first drew at 556, straight through
     the axis and its labels. */
  var AXIS_Y = 560, TICK_RULE = 566, TICK_TEXT = 580;
  var TRACK_BASE = 604, TRACK_H = 13, TRACK_GAP = 17;

  function drawLanes() {
    var g = $('lanes');
    if (!g || !LANES || !LANES.tracks) return;
    var tracks = LANES.tracks.filter(function (t) { return t.total > 0; });
    if (!tracks.length) return;
    var peak = tracks.reduce(function (m, t) {
      return Math.max(m, Object.keys(t.byDay).reduce(function (a, d) { return Math.max(a, t.byDay[d]); }, 0));
    }, 1);

    tracks.forEach(function (t, i) {
      var y = TRACK_BASE + i * (TRACK_H + TRACK_GAP);
      g.appendChild(el('line', { class: 'lane-track', x1: 118, y1: y, x2: 990, y2: y }));
      var nm = el('text', { class: 'lane-name', x: 124, y: y - 5 });
      nm.textContent = t.lane + '  ' + t.total;
      g.appendChild(nm);

      Object.keys(t.byDay).forEach(function (d) {
        var day = Number(d), n = t.byDay[d];
        if (day == null || !n) return;
        var h = Math.max(2, Math.round((n / peak) * TRACK_H));
        var x = X(day);
        var w = Math.max(3, Math.min(10, 3 + n * 0.35));
        g.appendChild(el('rect', {
          class: 'lane-fill', x: (x - w / 2).toFixed(1), y: (y - h).toFixed(1),
          width: w.toFixed(1), height: h, rx: 1
        }));
      });
    });

    var total = tracks.reduce(function (a, t) { return a + t.total; }, 0);
    var foot = el('text', {
      class: 'lane-count', x: 990,
      y: TRACK_BASE + tracks.length * (TRACK_H + TRACK_GAP) + 2, 'text-anchor': 'end'
    });
    foot.textContent = total + ' landings across ' + tracks.length + ' lanes, read from git on ' + String(LANES.generated || '').slice(0, 10);
    g.appendChild(foot);
  }

  var fill = $('fill'), head = $('head'), live = $('live');
  var stops = [].slice.call(document.querySelectorAll('.meter-stop'));
  var at = 0, inverted = false, busy = false;

  function paint() {
    var i = Math.round(at);
    var s = STATIONS[i];
    var f = FLOORS[s.floor];

    /* the solid stroke grows along the same path: pathLength normalises it to 1 */
    var frac = at / (STATIONS.length - 1);
    $('done').style.strokeDasharray = '1 1';
    $('done').style.strokeDashoffset = String(1 - frac);

    var px = s.x, py = f.y;
    if (at % 1 !== 0) {
      var a = Math.floor(at), b = Math.min(STATIONS.length - 1, a + 1), k = at - a;
      px = STATIONS[a].x + (STATIONS[b].x - STATIONS[a].x) * k;
      py = FLOORS[STATIONS[a].floor].y + (FLOORS[STATIONS[b].floor].y - FLOORS[STATIONS[a].floor].y) * k;
    }
    head.setAttribute('cx', px.toFixed(1)); head.setAttribute('cy', py.toFixed(1));

    for (var k2 = 0; k2 < dots.length; k2++) {
      dots[k2].setAttribute('data-past', k2 < i ? '1' : '0');
      dots[k2].setAttribute('r', k2 === i ? 9 : 6);
      dots[k2].setAttribute('style', 'stroke:' + (k2 === i ? 'var(--white)' : FLOORS[STATIONS[k2].floor].tone));
    }

    fill.style.height = (i / (STATIONS.length - 1) * 100) + '%';

    /* Depth follows the climb: the floor you are on comes forward, the floors
       below it sit back, and the ones above keep the building's own depth. */
    for (var bd = 0; bd < bandDepths.length; bd++) {
      var bkey = bandKeys[bd];
      bandDepths[bd].removeAttribute('data-live');
      bandDepths[bd].removeAttribute('data-spent');
      if (bkey === s.floor) bandDepths[bd].setAttribute('data-live', '1');
      else if (DEPTH[bkey] < DEPTH[s.floor]) bandDepths[bd].setAttribute('data-spent', '1');
    }
    for (var m = 0; m < stops.length; m++) {
      var on = stops[m].getAttribute('data-stop') === s.floor;
      stops[m].setAttribute('data-on', on ? '1' : '0');
      if (on && !stops[m].dataset.tone) stops[m].style.setProperty('--t', f.tone);
    }

    $('r-floor').textContent = f.name;
    $('r-title').textContent = s.title;
    $('r-when').textContent = s.when + ' · ' + (s.floor === 'cellar' ? 'below ground' : s.floor === 'stairs' ? 'the climb' : s.floor === 'floor' ? 'where you live' : 'above the roof');
    var body = $('r-body');
    body.innerHTML = '';
    var chip = document.createElement('span');
    chip.className = 'chip'; chip.style.setProperty('--t', f.tone);
    chip.innerHTML = '<span class="dot"></span>' + s.when;
    body.appendChild(chip);
    var p = document.createElement('p');
    p.style.marginTop = 'var(--space-sm)';
    p.textContent = s.lede;
    body.appendChild(p);
    if (s.points && s.points.length) {
      var ul = document.createElement('ul');
      s.points.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      body.appendChild(ul);
    }
    live.textContent = f.name + '. ' + s.title + '. ' + s.when + '.';
  }

  function goTo(i) {
    i = Math.max(0, Math.min(STATIONS.length - 1, i));
    var from = at, t0 = performance.now(), dur = 520;
    busy = true;
    (function step(now) {
      var k = Math.min(1, (now - t0) / dur);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      at = from + (i - from) * e;
      paint();
      if (k < 1) requestAnimationFrame(step); else busy = false;
    })(t0);
  }

  function step(n) { goTo(Math.round(at) + n); }

  addEventListener('wheel', function (ev) {
    ev.preventDefault();
    if (busy) return;
    var dir = inverted ? -1 : 1;
    at = Math.max(0, Math.min(STATIONS.length - 1, at + (ev.deltaY > 0 ? dir : -dir) * 0.34));
    paint();
  }, { passive: false });

  addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (k === 'ArrowUp' || k === 'ArrowRight' || k === 'PageDown' || k === ' ') { ev.preventDefault(); step(1); }
    else if (k === 'ArrowDown' || k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); step(-1); }
    else if (k === 'Home') { ev.preventDefault(); goTo(0); }
    else if (k === 'End') { ev.preventDefault(); goTo(STATIONS.length - 1); }
    else if (k === 'i' || k === 'I') { ev.preventDefault(); inverted = !inverted; $('down').textContent = inverted ? 'Climb up (inverted)' : 'Climb up'; }
  });

  $('down').addEventListener('click', function () { step(1); });
  $('up').addEventListener('click', function () { step(-1); });
  stops.forEach(function (b) {
    b.addEventListener('click', function () {
      var want = b.getAttribute('data-stop');
      for (var i = 0; i < STATIONS.length; i++) if (STATIONS[i].floor === want) { goTo(i); return; }
    });
  });
  dots.forEach(function (c) {
    c.addEventListener('click', function () { goTo(Number(c.getAttribute('data-i'))); });
    c.style.cursor = 'pointer';
  });

  /* touch: a drag upward climbs, matching the wheel. */
  var ty = null;
  addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', function (e) {
    if (ty === null) return;
    var dy = ty - e.touches[0].clientY;
    ty = e.touches[0].clientY;
    at = Math.max(0, Math.min(STATIONS.length - 1, at + dy / 260));
    paint();
  }, { passive: true });
  addEventListener('touchend', function () { ty = null; goTo(Math.round(at)); }, { passive: true });

  drawLanes();
  paint();
})();
</script>
</body>
