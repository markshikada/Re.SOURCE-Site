<title>Metrics CARD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000000;
    color: #FFFFFF;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
  }

  .stamp {
    font-size: 12px;
    font-weight: 400;
    width: 100%;
    max-width: 480px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #0D0D0D;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .head {
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-bottom: 1px solid #262626;
    padding-bottom: 24px;
  }

  .head h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .head p {
    font-size: 12px;
    font-weight: 400;
  }

  .stats {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat .label {
    font-size: 12px;
    font-weight: 400;
  }

  .stat .value {
    font-size: 24px;
    font-weight: 700;
    white-space: nowrap;
  }

  .stat .value .unit {
    font-size: 18px;
    font-weight: 600;
  }

  .stat .delta {
    font-size: 12px;
    font-weight: 400;
  }

  .spark {
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-top: 1px solid #262626;
    padding-top: 24px;
  }

  .spark .label {
    font-size: 12px;
    font-weight: 400;
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 48px;
    width: 100%;
  }

  .bars i {
    flex: 1 1 0;
    background: #000000;
    border: 1px solid #3DDC97;
    border-radius: 8px;
  }

  @media (min-width: 640px) {
    .stats {
      flex-direction: row;
    }

    .stat {
      flex: 1 1 0;
    }

    .stat + .stat {
      border-left: 1px solid #262626;
      padding-left: 24px;
    }

    .stat .value {
      font-size: 36px;
    }
  }
</style>

</head>
