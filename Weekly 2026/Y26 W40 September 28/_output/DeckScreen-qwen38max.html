<style>
/* Tokens, values exactly as written in Projects/Design System/tokens/.
   colours.css — twelve positions, plus the stroke law. */
:root{
  --cl-01-tone:#99DD00;
  --cl-02-flux:#FFD100;
  --cl-03-flow:#FFB000;
  --cl-04-love:#FF7700;
  --cl-05-bond:#FF5500;
  --cl-06-fire:#FF0000;
  --cl-07-path:#E02888;
  --cl-08-time:#9933CC;
  --cl-09-meta:#6655FF;
  --cl-10-form:#2277FF;
  --cl-11-type:#00BBDD;
  --cl-12-life:#00D460;
  --stroke:3px;

  /* greys.css — the ramp */
  --black:#000000;
  --g06:#0D0D0D;
  --g12:#1A1A1A;
  --g24:#333333;
  --g48:#555555;
  --g66:#888888;
  --g88:#CCCCCC;
  --white:#FFFFFF;
  --text-primary:var(--white);
  --text-secondary:var(--g66);
  --text-dim:var(--g48);
  --surface-page:var(--black);
  --surface-card:var(--g06);
  --surface-raised:var(--g12);
  --surface-border:var(--g24);

  /* space.css — 2:3:6 on u = 4px */
  --u:4px;
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:24px;
  --space-xl:48px;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:24px;

  /* typography.css — scale on u = 6px. Letter spacing is never declared. */
  --fs-caption:12px;  --lh-caption:18px;  --fw-caption:300;
  --fs-body:18px;     --lh-body:30px;     --fw-body:400;
  --fs-h2:24px;       --lh-h2:36px;       --fw-h2:600;
  --fs-h1:36px;       --lh-h1:48px;       --fw-h1:700;
  --fs-display:48px;  --lh-display:54px;  --fw-display:800;

  /* The deck lattice. One gap, one slot, one printed card. */
  --gap:24px;
  --slot:168px;             /* 2 slots + the one gap = the printed card */
  --card-w:360px;
  --card-h:510px;           /* the closed face sums to exactly this */
  --arrive:cubic-bezier(0.2, 0, 0, 1);

  --font:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Cascadia Mono",ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{
  background:var(--surface-page);
  color:var(--text-primary);
  font-family:var(--font);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  font-weight:var(--fw-body);
  min-height:100vh;
  padding:var(--space-xl) var(--space-md);   /* the page margin steps to 24 at 600 */
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* The table. Bands stack with the one gap; nothing else is between them. */
.table{display:flex;flex-direction:column;align-items:center;gap:var(--gap);width:100%}

/* One lattice: every band is a grid on the same tracks. Mobile-first, N = 1. */
.band{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:var(--gap);
  align-items:start;          /* a closed card never stretches beside an open one */
  width:100%;
}

/* The printed card. Black-table surface, ramp border, radius 12. */
.card{
  appearance:none;
  -webkit-appearance:none;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  justify-self:center;
  width:100%;
  max-width:var(--card-w);    /* min(360px, 100%): the card zooms to its column */
  aspect-ratio:5 / 7;
  padding:var(--space-lg);
  background:var(--surface-card);
  border:var(--stroke) solid var(--surface-border);
  border-radius:var(--radius-md);
  color:var(--text-primary);
  font:inherit;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  transition:border-color 180ms var(--arrive),background-color 180ms var(--arrive);
}
.card:hover{border-color:var(--g48)}
.card.is-open,.card.is-sel{border-color:var(--white);background:var(--surface-raised)}
.card.is-open:hover,.card.is-sel:hover{border-color:var(--white)}
.card:focus-visible{outline:2px solid var(--g88);outline-offset:3px}

.kicker{
  font-family:var(--mono);
  font-size:var(--fs-caption);
  line-height:var(--lh-caption);
  font-weight:var(--fw-caption);
  color:var(--text-secondary);
  text-transform:uppercase;
}

/* The ring mark: twelve 30-degree arcs, position 12 at the top, clockwise.
   Held positions carry their position colour as a 3px stroke; the rest stay g24. */
.ring{display:block;width:168px;height:168px;align-self:center;flex:none}

.title{
  font-size:var(--fs-h1);
  line-height:var(--lh-h1);
  font-weight:var(--fw-h1);
  text-align:center;
  min-height:48px;
}
.gloss{
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  font-weight:var(--fw-body);
  color:var(--text-secondary);
  text-align:center;
  min-height:60px;
}

/* The back, revealed where the card opens in place */
.back{display:none;flex-direction:column;gap:var(--gap)}
.card.is-open .back{display:flex}
.reading{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--fw-body)}
.question{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--fw-body);color:var(--text-secondary)}
.holds{display:flex;flex-direction:column;list-style:none}
.hold{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--fw-h2)}
.bead{
  display:inline-block;
  width:16px;height:16px;
  border:3px solid var(--surface-border);   /* border-color set per position */
  border-radius:var(--radius-sm);
  background:var(--black);
  margin-right:var(--space-md);
  vertical-align:middle;
}

.rel{
  font-family:var(--mono);
  font-size:var(--fs-caption);
  line-height:var(--lh-caption);
  font-weight:var(--fw-caption);
  color:var(--text-secondary);
  text-align:center;
  text-transform:uppercase;
}
.card.is-open .rel{text-align:left}
.rel--void{color:var(--text-dim)}

/* The open card on a phone frame: a sheet at the foot, head pinned, body scrolling. */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:12;
  display:flex;flex-direction:column;gap:var(--gap);
  max-height:80%;
  padding:var(--space-lg);
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  background:var(--surface-raised);
  border:var(--stroke) solid var(--white);
  border-radius:var(--radius-lg);
  transform:translateY(110%);
  visibility:hidden;
  transition:transform 360ms var(--arrive),visibility 0s linear 360ms;
}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform 360ms var(--arrive),visibility 0s}
.sheet-head{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:var(--gap);align-items:start;flex:none}
.sheet-word{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--fw-h2)}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.sheet-body .gloss{text-align:left;min-height:0}
.sheet-body .rel{text-align:left}
.shut{
  appearance:none;-webkit-appearance:none;
  width:44px;height:44px;
  display:grid;place-items:center;
  background:var(--surface-card);
  border:var(--stroke) solid var(--surface-border);
  border-radius:var(--radius-sm);
  color:var(--text-primary);
  font-family:var(--font);
  font-size:var(--fs-body);
  cursor:pointer;
  transition:border-color 180ms var(--arrive);
}
.shut:hover{border-color:var(--g48)}
.shut:focus-visible{outline:2px solid var(--g88);outline-offset:3px}

/* The lattice reads its count off the frame: 1, 2, 3, 4, 6 — the widest that fits.
   Every card spans whole slots; the printed card is 2 slots from 384 up. */
@media (min-width:384px){
  .band{grid-template-columns:repeat(2,var(--slot))}
  .card{
    grid-column:span 2;
    justify-self:stretch;
    max-width:none;
    aspect-ratio:auto;
    min-height:var(--card-h);
    padding:var(--space-xl);
  }
}
@media (min-width:576px){
  .band{grid-template-columns:repeat(3,var(--slot))}
}
@media (min-width:600px){
  body{padding:var(--space-xl) var(--space-lg)}
}
@media (min-width:720px){
  .sheet{display:none}
}
@media (min-width:792px){
  .band{grid-template-columns:repeat(4,var(--slot))}
}
@media (min-width:1176px){
  .band{grid-template-columns:repeat(6,var(--slot))}
  /* Two-card bands sit centre-adjacent: counterparts side by side,
     so PRIME meets PART and BASE meets BLEND and the wheel closes. */
  .band--two .card:nth-of-type(1){grid-column:2 / span 2}
  .band--two .card:nth-of-type(2){grid-column:4 / span 2}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important}
}
</style>

<h1 class="sr">Word DECK — ninety words in three sets, laid out on the table</h1>

<main class="table" id="table"></main>

<aside class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="Open card" aria-hidden="true">
  <div class="sheet-head">
    <div>
      <div class="kicker" id="sheetKicker"></div>
      <h2 class="sheet-word" id="sheetTitle"></h2>
    </div>
    <button class="shut" id="sheetShut" type="button" aria-label="Close the open card">&times;</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

{"set":"Aspect STATE","setKey":"s","ring":"mid","id":"s-core","holds":0,"row":"CORE","type":"Core","titles":["HERE"],"picks":[],"blendPicks":[],"gloss":"Still, under every passing mood","reading":"Nothing has to be felt for this to be present. It sits behind whatever passes, unchanged by any of it.","question":"What is here when the feeling goes?","lastLabel":"","last":"","drafted":true},
{"set":"Anchor TAG","setKey":"t","ring":"inner","id":"t-core","holds":0,"row":"CORE","type":"Core","titles":["YOU"],"picks":[],"blendPicks":[],"gloss":"Witness with no label attached","reading":"Perception arrives before naming does. This is the point that observes and takes no category of its own.","question":"Who is doing the looking?","lastLabel":"","last":"","drafted":true},

{"set":"Abstract REALM","setKey":"r","ring":"outer","id":"r-pair-0410","holds":2,"row":"PAIR","type":"Pair","titles":["LOVE","FORM"],"picks":[2,5],"blendPicks":[],"gloss":"Attraction, then the vessel","reading":"What gathers decides the shape that ends up holding it. Structure is the consequence, not the cause.","question":"What is being drawn together here?","lastLabel":"Polar","last":"FORM • LOVE","drafted":true,"counterId":"r-pair-1004"},

{"set":"Aspect STATE","setKey":"s","ring":"mid","id":"s-blend","holds":6,"row":"BLEND","type":"Blend","titles":["BLEND"],"picks":[],"blendPicks":[0,1,2,3,4,5],"grid":[{"w":"MOOD","col":"#99DD00"},{"w":"TRUE","col":"#FFB000"},{"w":"NEED","col":"#FF5500"},{"w":"WANT","col":"#E02888"},{"w":"VIEW","col":"#6655FF"},{"w":"MODE","col":"#00BBDD"}],"gloss":"The states found only in transit","reading":"Each one sits on the way to somewhere else, rarely a place to stop. Brief, and easy to mistake for the state just left.","question":"Which in-between are you in today?","lastLabel":"Counter","last":"BASE","counterId":"s-base","drafted":true}
];

var STORE = (Array.isArray(window.DECK_CARDS) && window.DECK_CARDS.length) ? window.DECK_CARDS : FALLBACK;
function byId(id){
  var c = null;
  if (Array.isArray(window.DECK_CARDS)) c = window.DECK_CARDS.find(function(x){return x.id===id;});
  if (!c) c = FALLBACK.find(function(x){return x.id===id;});
  return c;
}

/* The twelve, in deck order, banded by the deck's one axis: how much of the
   ring a card holds. Rows run CORE to BASE and BLEND. */
var BANDS = [
  ["r-core","s-core","t-core"],
  ["r-single-10","s-single-08","t-single-03"],
  ["r-pair-0410","s-pair-0511"],
  ["r-triad-prime","t-triad-part"],
  ["r-base","s-blend"]
];

/* Position colours by wheel position, named exactly as colours.css names them.
   The stems are legacy labels; the words shown come only from the store. */
var TOK = {1:"--cl-01-tone",2:"--cl-02-flux",3:"--cl-03-flow",4:"--cl-04-love",5:"--cl-05-bond",6:"--cl-06-fire",7:"--cl-07-path",8:"--cl-08-time",9:"--cl-09-meta",10:"--cl-10-form",11:"--cl-11-type",12:"--cl-12-life"};

/* picks index the six base positions (12,2,4,6,8,10); blendPicks the six
   crossings (1,3,5,7,9,11). Position 12 sits at the top; the count runs clockwise. */
function heldPositions(c){
  return c.picks.map(function(n){ return (n*2)%12 || 12; })
    .concat(c.blendPicks.map(function(n){ return n*2+1; }));
}

var C = 84, R = 76;
function pt(deg, r){
  var a = deg * Math.PI / 180;
  return [Math.round(C + r*Math.sin(a)), Math.round(C - r*Math.cos(a))];
}
function ringSVG(c){
  var held = heldPositions(c);
  var s = '<svg class="ring" viewBox="0 0 168 168" width="168" height="168" fill="none" role="img" aria-label="' +
    (held.length ? 'Ring positions ' + held.slice().sort(function(a,b){return a-b;}).join(', ') + ' held' : 'The ring, no position held') + '">';
  for (var p = 1; p <= 12; p++){
    var t = (p % 12) * 30;
    var a1 = pt(t - 13, R), a2 = pt(t + 13, R);
    var on = held.indexOf(p) !== -1;
    s += '<path d="M ' + a1[0] + ' ' + a1[1] + ' A ' + R + ' ' + R + ' 0 0 1 ' + a2[0] + ' ' + a2[1] +
         '" stroke-width="3" style="stroke:var(' + (on ? TOK[p] : '--g24') + ')"/>';
  }
  if (held.length === 2){
    /* The polar axis: two coloured radii meeting at the quiet centre, not crossing it. */
    held.forEach(function(p){
      var t = (p % 12) * 30;
      var i = pt(t, 12), o = pt(t, 72);
      s += '<path d="M ' + i[0] + ' ' + i[1] + ' L ' + o[0] + ' ' + o[1] +
           '" stroke-width="3" style="stroke:var(' + TOK[p] + ')"/>';
    });
  }
  return s + '</svg>';
}

function wordsHTML(c){
  if (!c.grid || !c.grid.length) return '';
  return '<span class="holds">' + c.grid.map(function(g){
    return '<span class="hold"><span class="bead" style="border-color:' + g.col + '"></span>' + g.w + '</span>';
  }).join('') + '</span>';
}
function relHTML(c){
  return c.lastLabel
    ? '<span class="rel">' + c.lastLabel + ' — ' + c.last + '</span>'
    : '<span class="rel rel--void">—</span>';
}
function titleOf(c){ return c.titles.join(' • '); }

/* ---- build the table ---- */
var table = document.getElementById('table');
var els = {};           /* id -> card button */
var order = [];         /* deal order */
BANDS.forEach(function(ids){
  var band = document.createElement('section');
  band.className = 'band' + (ids.length === 2 ? ' band--two' : '');
  var rows = [];
  ids.forEach(function(id){ var r = byId(id).row; if (rows.indexOf(r) === -1) rows.push(r); });
  band.setAttribute('aria-label', 'Row ' + rows.join(' and '));
  ids.forEach(function(id){
    var c = byId(id);
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.id = id;
    card.setAttribute('aria-expanded', 'false');
    card.innerHTML =
      '<span class="kicker">' + c.set + ' · ' + c.row + '</span>' +
      ringSVG(c) +
      '<span class="title">' + titleOf(c) + '</span>' +
      '<span class="gloss">' + c.gloss + '</span>' +
      '<span class="back">' +
        '<span class="reading">' + c.reading + '</span>' +
        '<span class="question">' + c.question + '</span>' +
        wordsHTML(c) +
      '</span>' +
      relHTML(c);
    card.addEventListener('click', function(e){
      e.stopPropagation();
      openId = (openId === id) ? null : id;
      apply(true);
    });
    band.appendChild(card);
    els[id] = card;
    order.push(card);
  });
  table.appendChild(band);
});

/* ---- the open card ---- */
var sheet = document.getElementById('sheet');
var sheetKicker = document.getElementById('sheetKicker');
var sheetTitle = document.getElementById('sheetTitle');
var sheetBody = document.getElementById('sheetBody');
var sheetShut = document.getElementById('sheetShut');
var status = document.getElementById('status');
var phone = window.matchMedia('(max-width:719px)');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
var EASE = 'cubic-bezier(0.2, 0, 0, 1)';
var openId = 'r-pair-0410';   /* one card is open when the table is laid */

function fillSheet(c){
  sheetKicker.textContent = c.set + ' · ' + c.row;
  sheetTitle.textContent = titleOf(c);
  sheetBody.innerHTML =
    ringSVG(c) +
    '<p class="gloss">' + c.gloss + '</p>' +
    '<p class="reading">' + c.reading + '</p>' +
    '<p class="question">' + c.question + '</p>' +
    wordsHTML(c) +
    relHTML(c);
}

function apply(animate){
  var isPhone = phone.matches;
  Object.keys(els).forEach(function(id){
    var el = els[id];
    var sel = (id === openId);
    el.setAttribute('aria-expanded', sel ? 'true' : 'false');
    el.classList.toggle('is-sel', sel && isPhone);
    var want = sel && !isPhone;
    if (want !== el.classList.contains('is-open')){
      if (animate && !reduce.matches){
        var from = el.offsetHeight;
        el.classList.toggle('is-open', want);
        var to = el.offsetHeight;
        if (from !== to) el.animate({height:[from + 'px', to + 'px']}, {duration:360, easing:EASE});
      } else {
        el.classList.toggle('is-open', want);
      }
    }
  });
  if (isPhone && openId){
    fillSheet(byId(openId));
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
  } else {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  status.textContent = openId ? titleOf(byId(openId)) + ' open' : 'Card closed';
}

function closeOpen(){
  if (!openId) return;
  var prev = openId;
  openId = null;
  apply(true);
  if (sheet.contains(document.activeElement) && els[prev]) els[prev].focus();
}

sheetShut.addEventListener('click', function(e){ e.stopPropagation(); closeOpen(); });
document.addEventListener('click', function(e){
  if (!e.target.closest('.card') && !e.target.closest('.sheet')) closeOpen();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeOpen();
});
phone.addEventListener('change', function(){ apply(true); });

/* Lay the table: one card already open, then the deal. */
apply(false);
order.forEach(function(el, i){
  el.animate(
    [{opacity:0, transform:'translateY(12px)'}, {opacity:1, transform:'none'}],
    {duration: reduce.matches ? 1 : 360, delay: reduce.matches ? 0 : i * 60, easing: EASE, fill: 'backwards'}
  );
});
})();
</script>
</body>
</html>
