  Self-contained: card data copied from Projects/Design System/data/deck-data.js,
  token values copied from Projects/Design System/tokens/ (colours, greys, space,
  typography, motion). No external fetches, no external fonts.

  Lattice law (WordDeck master, five rules): one lattice, one gap, the count
  divides the deck, nothing stretches, leftover space is margin.
  The open card takes tracks from the same grid: at 1440 it spans half the
  count over two rows, so twelve closed cards plus the reader fill whole rows.
  Below 721 the reader becomes a bottom sheet, peek capped at half the frame,
  handle lifts it full, head and foot pinned, body the one part that scrolls.
  Law: whole numbers only; radius 8 / 12 / 24; colour is a stroke on a shape,
  never a fill behind text; twelve position colours and the greyscale only;
  type 12 / 18 / 24 / 36 / 48 / 72, leading on the 6px unit, 30 the exception;
  no letter-spacing declared.
-->
<style>
:root{

  --black:#000000; --g06:#0D0D0D; --g12:#1A1A1A; --g24:#333333; --g48:#555555;

  /* space.css */
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:24px; --space-xl:48px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:24px;
  /* typography.css */
  --fs-caption:12px; --lh-caption:18px;

  /* motion.css */

  --font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,monospace;
  /* the lattice, written by layout() after measuring the frame */

}

/* – controls, states law: idle g48/g66, hover and pressed white on g88 – */
.ctl{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);
  height:32px;padding:0 var(--space-md);background:var(--surface-card);color:var(--text-secondary);

  font-family:var(--font-mono);font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:400;

/* – the lattice: one grid, one gap, nothing stretches – */

#lattice{display:grid;grid-template-columns:repeat(var(--ocols),var(--slot));grid-auto-rows:var(--cardh);

{"set":"Abstract REALM","setKey":"r","id":"r-single-06","holds":1,"row":"SINGLE","type":"Single","titles":["FIRE"],"picks":[3],"blendPicks":[],"gloss":"Energy that consumes to clear","reading":"It insists on full expression and takes the obsolete with it. What is left afterwards is heat and space.","question":"Where is the sudden spark coming from?","lastLabel":"Polar","last":"LIFE"}
];

/* the position colours, from tokens/colours.css via the deck's own grids */
var BASE_HEX = ['#00D460','#FFD100','#FF7700','#FF0000','#9933CC','#2277FF'];
var BLEND_HEX = ['#99DD00','#FFB000','#FF5500','#E02888','#6655FF','#00BBDD'];
var SHORT = {'Abstract REALM':'REALM','Aspect STATE':'STATE','Anchor TAG':'TAG'};

var body = document.body;
var lattice = document.getElementById('lattice');
var reader = document.getElementById('reader');
var statusEl = document.getElementById('status');
var state = { open: null, compact: false };
var cards = [];        /* the twelve closed cells, in deck order */
var cardById = {};

function byId(id){ for (var i=0;i<DECK.length;i++) if (DECK[i].id===id) return DECK[i]; return null; }
function indexOf(id){ for (var i=0;i<DECK.length;i++) if (DECK[i].id===id) return i; return -1; }
function wordOf(e){ return e.titles.join(' • '); }
function pad2(n){ return String(n).padStart(2,'0'); }

/* the card's accent: colour is a stroke on the shape, never a fill behind text */
function accentOf(e){
  if (e.row === 'SET') return '#FFFFFF';
  if (e.row === 'CORE') return '#555555';
  if ((e.picks || []).length) return (e.grid && e.grid[0]) ? e.grid[0].col : BASE_HEX[e.picks[0]];
  return (e.grid && e.grid[0]) ? e.grid[0].col : BLEND_HEX[e.blendPicks[0]];
}

/* the clock-face position label, the shared lib's own rule */
function posLabelOf(e){
  var picks = e.picks || [], blend = e.blendPicks || [];
  var count = picks.length + blend.length;
  if (count === 0) return 'VOID';
  if (count === 12) return 'P01–P12';
  var nums = picks.map(function(i){ return i*60; })
    .concat(blend.map(function(i){ return i*60+30; }))
    .map(function(a){ return ((a/30 + 11) % 12) + 1; });
  var sorted = nums.slice().sort(function(a,b){ return a-b; });
  var step2 = sorted.length > 3 && sorted.every(function(n,k){ return k===0 || n - sorted[k-1] === 2; });
  if (step2) return 'P' + pad2(sorted[0]) + '–P' + pad2(sorted[sorted.length-1]);
  var leadA = picks.length ? picks[0]*60 : blend[0]*60+30;
  var leadN = ((leadA/30 + 11) % 12) + 1;
  var run = sorted.slice();
  var at = run.indexOf(leadN);
  if (at > 0) run = [run[at]].concat(run.slice(0,at), run.slice(at+1));
  return 'P' + run.map(pad2).join('·');
}

/* the relation this card names, resolved inside the twelve */
function relOf(e){
  if (e.counterId){
    var t = byId(e.counterId);
    if (t) return { label: e.lastLabel || 'Counter', id: t.id };
  }
  if (e.row === 'SINGLE' && e.last){
    for (var i=0;i<DECK.length;i++){
      var x = DECK[i];
      if (x.set === e.set && x.row === 'SINGLE' && x.titles[0] === e.last)
        return { label: e.lastLabel || 'Polar', id: x.id };
    }
  }
  return null;
}

/* the mark: twelve faint petals, the lit picks in position colour, whole
   coordinates only. Petal circles r29 at centre distance 29 on a 120 field. */
function markFor(e){
  var s = '', i;
  if (e.row !== 'SET'){
    for (i = 0; i < 12; i++)
      s += '<circle cx="60" cy="31" r="29" fill="none" stroke="#333333" stroke-width="1" transform="rotate(' + (i*30) + ' 60 60)"/>';
  }
  if (e.row === 'SET'){
    e.grid.forEach(function(g,j){
      s += '<circle cx="60" cy="31" r="29" fill="none" stroke="' + g.col + '" stroke-width="3" transform="rotate(' + (j*30) + ' 60 60)"/>';
    });
  } else {
    (e.picks || []).forEach(function(p,k){
      var col = (e.grid && e.grid[k]) ? e.grid[k].col : BASE_HEX[p];
      var w = (e.picks.length === 1) ? 5 : 3;
      s += '<circle cx="60" cy="31" r="29" fill="none" stroke="' + col + '" stroke-width="' + w + '" transform="rotate(' + (p*60) + ' 60 60)"/>';
    });
    (e.blendPicks || []).forEach(function(p,k){
      var col = (e.grid && e.grid[k]) ? e.grid[k].col : BLEND_HEX[p];
      var w = (e.blendPicks.length === 1) ? 5 : 3;
      s += '<circle cx="60" cy="31" r="29" fill="none" stroke="' + col + '" stroke-width="' + w + '" transform="rotate(' + (p*60+30) + ' 60 60)"/>';
    });
  }
  s += '<circle cx="60" cy="60" r="29" fill="none" stroke="#333333" stroke-width="1"/>';
  s += '<circle cx="60" cy="60" r="4" fill="#FFFFFF"/>';
  return s;
}

/* – build the twelve closed cells – */
function renderCards(){
  DECK.forEach(function(e, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.dataset.id = e.id;
    b.style.borderTop = '3px solid ' + accentOf(e);
    b.style.animationDelay = (i * 60) + 'ms'; /* the motion token's stagger, 60ms unit */
    var rel = relOf(e);
    var relWord = rel ? wordOf(byId(rel.id)) : '';
    b.setAttribute('aria-label', wordOf(e) + ', ' + e.row.toLowerCase() + ' card, ' + e.set +
      (rel ? ', ' + rel.label.toLowerCase() + ' ' + relWord : '') + '. Open the card.');
    b.innerHTML =
      '<span class="c-top"><span class="mono c-set">' + SHORT[e.set] + '</span><span class="mono">' + e.row + '</span></span>' +
      '<svg class="c-mark" viewBox="0 0 120 120" aria-hidden="true">' + markFor(e) + '</svg>' +
      '<span class="c-title">' + wordOf(e) + '</span>' +
      '<span class="c-gloss">' + e.gloss + '</span>' +
      '<span class="c-foot"><span class="mono c-pos">' + posLabelOf(e) + '</span><span class="mono c-rel"></span></span>' +
      '<span class="c-badge mono" hidden></span>';
    b.addEventListener('click', function(){ openCard(e.id); });
    lattice.appendChild(b);
    cards.push(b);
    cardById[e.id] = b;
  });
}

function updateRelTexts(){
  DECK.forEach(function(e){
    var rel = relOf(e);
    var cell = cardById[e.id];
    var el = cell.querySelector('.c-rel');
    var posEl = cell.querySelector('.c-pos');
    if (!rel){ el.textContent = ''; posEl.style.display = ''; return; }
    el.textContent = state.compact ? wordOf(byId(rel.id)) : rel.label.toUpperCase() + ' · ' + wordOf(byId(rel.id));
    /* compact cards carry one footer fact: the relation. The position reads in the sheet. */
    posEl.style.display = state.compact ? 'none' : '';
  });
}

/* – the lattice, measured off the frame it sits in – */
function layout(){
  var frame = lattice.clientWidth;
  var mobile = frame < 721;
  var cols, cardW, gapv, osp;
  if (mobile){
    gapv = 8;
    cols = 3;
    cardW = Math.min(180, Math.floor((frame - 2 * gapv) / 3));
    if (cardW < 96){ cols = 2; cardW = Math.min(180, Math.floor((frame - gapv) / 2)); }
    if (cardW < 96){ cols = 1; cardW = Math.max(96, frame); }
  } else {
    cardW = 180; gapv = 24;
    var fits = function(n){ return n * cardW + (n - 1) * gapv <= frame; };
    cols = [6,4,3,2,1].filter(function(n){ return 12 % n === 0; }).find(fits) || 1;
  }
  var cardH = Math.round(cardW * 504 / 360);
  osp = cols >= 4 ? cols / 2 : cols;
  lattice.style.setProperty('--slot', cardW + 'px');
  lattice.style.setProperty('--cardh', cardH + 'px');
  lattice.style.setProperty('--gapv', gapv + 'px');
  lattice.style.setProperty('--ocols', String(cols));
  lattice.style.setProperty('--osp', String(osp));
  body.dataset.mode = mobile ? 'sheet' : 'grid';
  state.compact = cardW < 160;
  body.classList.toggle('compact', state.compact);
  updateRelTexts();
  setSheetH();
}

function setSheetH(){
  if (body.dataset.mode === 'sheet' && state.open)
    lattice.style.setProperty('--sheet-h', reader.offsetHeight + 'px');
}

/* – open, close, step, deal – */
function markLattice(){
  var open = state.open ? byId(state.open) : null;
  var openRel = open ? relOf(open) : null;
  cards.forEach(function(el){
    var id = el.dataset.id;
    var e = byId(id);
    var here = state.open === id;
    var relHit = false, relLabel = '';
    if (open && !here){
      if (openRel && openRel.id === id){ relHit = true; relLabel = openRel.label.toUpperCase(); }
      var own = relOf(e);
      if (!relHit && own && own.id === state.open){ relHit = true; relLabel = own.label.toUpperCase(); }
    }
    el.classList.toggle('here', here);
    el.classList.toggle('rel', relHit);
    var badge = el.querySelector('.c-badge');
    badge.hidden = !relHit;
    badge.textContent = relLabel;
  });
}

function fillReader(e){
  document.getElementById('rdSet').textContent = e.set.toUpperCase();
  document.getElementById('rdRow').textContent = e.row;
  document.getElementById('rdMark').innerHTML = markFor(e);
  document.getElementById('rdPos').textContent = posLabelOf(e);
  document.getElementById('rdHolds').textContent = 'HOLDS ' + e.holds;
  document.getElementById('rdTitle').textContent = wordOf(e);
  document.getElementById('rdGloss').textContent = e.gloss;
  document.getElementById('rdReading').textContent = e.reading;
  document.getElementById('rdQuestion').textContent = e.question;
  reader.style.borderTopColor = accentOf(e);
  document.getElementById('rdIndex').textContent = (indexOf(e.id) + 1) + ' OF ' + DECK.length;

  var chips = document.getElementById('rdChips');
  chips.innerHTML = '';
  var rel = relOf(e);
  if (rel){
    var t = byId(rel.id);
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'chip';
    c.style.borderColor = accentOf(t);
    c.textContent = rel.label.toUpperCase() + ' · ' + wordOf(t);
    c.setAttribute('aria-label', 'Open ' + wordOf(t) + ', the ' + rel.label.toLowerCase() + ' of this card');
    c.addEventListener('click', function(){ openCard(t.id); });
    chips.appendChild(c);
  }
  var setId = e.setKey + '-set';
  if (setId !== e.id && byId(setId)){
    var sc = document.createElement('button');
    sc.type = 'button'; sc.className = 'chip';
    sc.textContent = 'SET · ' + SHORT[e.set];
    sc.setAttribute('aria-label', 'Open the ' + SHORT[e.set] + ' set card');
    sc.addEventListener('click', function(){ openCard(setId); });
    chips.appendChild(sc);
  }

  var idx = indexOf(e.id);
  var prev = document.getElementById('rdPrev'), next = document.getElementById('rdNext');
  prev.setAttribute('aria-disabled', idx === 0 ? 'true' : 'false');
  next.setAttribute('aria-disabled', idx === DECK.length - 1 ? 'true' : 'false');
}

function openCard(id, opts){
  var e = byId(id);
  if (!e) return;
  state.open = id;
  body.dataset.open = '1';
  fillReader(e);
  markLattice();
  reader.hidden = false;
  reader.classList.remove('in');
  void reader.offsetWidth;
  reader.classList.add('in');
  requestAnimationFrame(setSheetH);
  if (!opts || !opts.noFocus){
    var target = body.dataset.mode === 'sheet' ? document.getElementById('rdClose') : reader;
    target.focus({ preventScroll: true });
  }
  if (!opts || !opts.quiet) say(wordOf(e) + ' opened.');
  if (cardById[id]) cardById[id].scrollIntoView({ block: 'nearest' });
}

function closeCard(quiet){
  if (!state.open) return;
  var e = byId(state.open);
  var returnTo = cardById[state.open];
  state.open = null;
  body.dataset.open = '0';
  reader.hidden = true;
  reader.classList.remove('in','full');
  document.getElementById('grab').setAttribute('aria-expanded','false');
  markLattice();
  if (!quiet) say(wordOf(e) + ' closed.');
  if (returnTo && !quiet) returnTo.focus({ preventScroll: true });
}

function step(d){
  if (!state.open) return;
  var idx = indexOf(state.open);
  var next = Math.min(Math.max(idx + d, 0), DECK.length - 1);
  if (next !== idx) openCard(DECK[next].id);
  else say(next === 0 ? 'First card in the deck.' : 'Last card in the deck.');
}

function deal(){
  closeCard(true);
  cards.forEach(function(el){ el.classList.remove('dealt'); });
  void lattice.offsetWidth;
  cards.forEach(function(el){ el.classList.add('dealt'); });
  say('Dealt the deck.');
}

function say(msg){ statusEl.textContent = msg; }

function moveFocus(d){
  var idx = cards.indexOf(document.activeElement);
  if (idx < 0){ cards[0].focus(); return; }
  var next = Math.min(Math.max(idx + d, 0), cards.length - 1);
  cards[next].focus();
}

/* – hands: pointer, keys, and the legend that names them – */
document.getElementById('deal').addEventListener('click', deal);
document.getElementById('rdClose').addEventListener('click', function(){ closeCard(); });
document.getElementById('rdPrev').addEventListener('click', function(){
  if (this.getAttribute('aria-disabled') !== 'true') step(-1);
});
document.getElementById('rdNext').addEventListener('click', function(){
  if (this.getAttribute('aria-disabled') !== 'true') step(1);
});
document.getElementById('grab').addEventListener('click', function(){
  var full = reader.classList.toggle('full');
  this.setAttribute('aria-expanded', full ? 'true' : 'false');
  this.setAttribute('aria-label', full ? 'Pack the card' : 'Expand the card');
  requestAnimationFrame(setSheetH);
  say(full ? 'Card expanded.' : 'Card packed.');
});
lattice.addEventListener('click', function(ev){
  if (ev.target === lattice && body.dataset.mode === 'sheet') closeCard();
});
document.addEventListener('keydown', function(ev){
  var t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (ev.key === 'Escape' && state.open){ closeCard(); ev.preventDefault(); }
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft'){
    var d = ev.key === 'ArrowRight' ? 1 : -1;
    if (state.open) step(d); else moveFocus(d);
    ev.preventDefault();
  }
  else if ((ev.key === 'd' || ev.key === 'D') && !ev.metaKey && !ev.ctrlKey && !ev.altKey){
    deal(); ev.preventDefault();
  }
});

/* – boot – */
function legend(){
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  document.getElementById('legend').textContent = coarse
    ? 'TAP A CARD TO OPEN · HANDLE EXPANDS · TAP THE DECK TO PACK'
    : 'CLICK OR ENTER OPEN · ESC CLOSE · ← → STEP · D DEAL';
}
function stamp(){
  var d = new Date(document.lastModified);
  document.getElementById('stamp').textContent = 'RE.SOURCE · POLISH ROUND · UPDATED ' +
    d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
    pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
renderCards();
layout();
legend();
stamp();
cards.forEach(function(el){ el.classList.add('dealt'); });
openCard('r-single-12', { noFocus: true, quiet: true });
say('Dealt the deck. LIFE is open.');
if (typeof ResizeObserver === 'function'){
  new ResizeObserver(layout).observe(lattice);
}
window.addEventListener('resize', layout);
</script>
</body>
